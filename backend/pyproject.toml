[project]
name = "healthwidgets-server"
version = "0.1.0"
description = "Sync server for the Health Widgets iOS app: connects to sports-watch providers (Garmin first) and serves normalized health snapshots."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    # Unofficial Garmin Connect client. >=0.3 is required: it dropped garth for
    # the mobile SSO + DI OAuth flow, JSON-serializable MFA state and dumps().
    "garminconnect>=0.3.20",
]

[project.scripts]
healthwidgets-server = "healthwidgets.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthwidgets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]
